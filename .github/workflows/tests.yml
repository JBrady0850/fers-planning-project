name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine tests
        run: node --test tests/engine.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the browser test
        run: |
          pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Browser test, every tab and every file
        run: python tests/ui_smoke.py
